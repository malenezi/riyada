name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Skill copies are in sync
        run: python tools/sync_assets.py --check
      - name: Repository checks
        run: python tools/validate.py
      - name: Tests without optional dependencies
        run: python -m unittest discover -s tests
      - name: Tests with openpyxl
        run: |
          pip install openpyxl
          python -m unittest discover -s tests
      - name: Example context packs pass the linter
        run: |
          python shared/scripts/context_lint.py examples/mawja/context/en --today 2026-11-16
          python shared/scripts/context_lint.py examples/mawja/context/ar --today 2026-11-16
